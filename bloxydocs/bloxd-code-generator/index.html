<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloxd.io Code & Command Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .tab-btn.active { border-bottom: 2px solid #38bdf8; color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-4xl w-full mx-auto mb-6 flex justify-between items-center border-b border-slate-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-sky-400">Bloxd.io Tool Studio</h1>
      <p class="text-sm text-slate-400">Generate WorldBuilder commands & Code Block scripts for private lobbies.</p>
    </div>
    <span class="bg-sky-950 text-sky-300 text-xs px-3 py-1 rounded-full border border-sky-800">v1.0 Standalone</span>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl flex-grow flex flex-col">
    
    <!-- Mode Tabs -->
    <div class="flex border-b border-slate-800 mb-6 gap-6 text-slate-400">
      <button id="tab-worldbuilder" onclick="switchTab('worldbuilder')" class="tab-btn active pb-2">
        🛠️ WorldBuilder Commands
      </button>
      <button id="tab-codeblock" onclick="switchTab('codeblock')" class="tab-btn pb-2">
        💻 Code Block JS API
      </button>
    </div>

    <!-- WORLDBUILDER TAB -->
    <div id="panel-worldbuilder" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Select Action</label>
        <select id="wb-action" onchange="renderWBFields()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-sky-500">
          <option value="set">//set (Fill selected region with a block)</option>
          <option value="replace">//replace (Replace specific block with another)</option>
          <option value="stack">//stack (Repeat current selection directionally)</option>
          <option value="rotate">//rotate (Rotate copied clipboard structure)</option>
          <option value="schematic">//schematic (Save or Load a structure)</option>
        </select>
      </div>

      <!-- Dynamic WB Inputs -->
      <div id="wb-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- CODE BLOCK API TAB -->
    <div id="panel-codeblock" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Script Template</label>
        <select id="cb-template" onchange="renderCBFields()" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-sky-500">
          <option value="jump">Player Launch Pad (Boost velocity upwards)</option>
          <option value="zombie">Transform Players into Zombies</option>
          <option value="speed">Apply Speed Buff to Player</option>
          <option value="tp">Teleport Trigger (To specific coordinates)</option>
        </select>
      </div>

      <!-- Dynamic Code Block Inputs -->
      <div id="cb-fields" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- OUTPUT SECTION -->
    <div class="mt-auto pt-6">
      <div class="flex justify-between items-center mb-2">
        <label class="text-sm font-semibold text-slate-300">Generated Code / Command</label>
        <button onclick="copyOutput()" id="copy-btn" class="bg-sky-600 hover:bg-sky-500 text-white text-xs px-3 py-1.5 rounded-md font-medium transition">
          📋 Copy to Clipboard
        </button>
      </div>
      <div class="relative">
        <textarea id="output-box" readonly rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sky-400 font-mono text-sm focus:outline-none resize-none"></textarea>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
